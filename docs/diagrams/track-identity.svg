<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img"><title>Track identity and beat source: metadata hint, fingerprint, cache key</title><rect width="680" height="640" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="240" y="30" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340.0" y="52.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">AudioCanonicalizer</text><path d="M240 52 L160 52 L160 100" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M440 52 L520 52 L520 100" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="102" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Metadata hint, t = 0</text><text x="160.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">title, artist, duration</text><rect x="420" y="102" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="520.0" y="121.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Fingerprint, t ≈ 10–15 s</text><text x="520.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">from the sound; file: before play</text><path d="M160 158 L160 184" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="186" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Early lookup</text><text x="160.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">known? + online prior (opt-in)</text><path d="M520 158 L520 214 L262 214" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="390" y="200" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">confirms or overrides</text><path d="M160 242 L160 268" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="270" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="292.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Known by fingerprint?</text><path d="M60 292 L36 292 L36 400 L58 400" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="334" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">yes</text><path d="M260 292 L340 292 L340 350" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="326" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no</text><rect x="60" y="372" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="160.0" y="391.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Learned grid drives</text><text x="160.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">from the first bar</text><rect x="240" y="352" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340.0" y="374.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Whole track ahead?</text><path d="M340 396 L340 440" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="420" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">yes (file)</text><path d="M440 374 L540 374 L540 440" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="550" y="420" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no (stream)</text><rect x="240" y="442" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="461.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">File grid</text><text x="340.0" y="481.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">byte hash = cache key only</text><rect x="450" y="442" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="545.0" y="461.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Tracker + rolling grid</text><text x="545.0" y="481.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">buffer per identity, in RAM</text><path d="M340 498 L340 540" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M545 498 L545 540" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M160 428 L160 540" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="542" width="580" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="350.0" y="561.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Always: live analysis measures and corrects</text><text x="350.0" y="581.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">at track end: full analysis → learned grid stored under the fingerprint; audio never persisted</text></svg>