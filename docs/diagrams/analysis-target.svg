<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>Target analysis architecture: file and stream share the canonicalizer and the detector</title><rect width="680" height="420" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="105.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">VirtualPlayer</text><text x="105.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">live stream PCM</text><rect x="40" y="260" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="105.0" y="279.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Library file</text><text x="105.0" y="299.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">LMS download</text><rect x="210" y="160" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="280.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">AudioCanonicalizer</text><text x="280.0" y="199.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">48 kHz stereo, soxr</text><path d="M170 88 L190 88 L190 188 L208 188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M170 288 L190 288 L190 188" fill="none" stroke="#888780" stroke-width="1.5"/><rect x="390" y="160" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="460.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">One attack detector</text><text x="460.0" y="199.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">per channel, shared</text><path d="M350 188 L388 188" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="390" y="60" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="460.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Live analysis</text><text x="460.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">BeatDetector, tracker</text><path d="M460 160 L460 118" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="380" y="240" width="160" height="96" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="460.0" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">bounded subprocess</text><rect x="390" y="268" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="460.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Grid analyser</text><text x="460.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">whole file or head</text><path d="M460 216 L460 238" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="570" y="60" width="70" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="605.0" y="79.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Beat</text><text x="605.0" y="99.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Fusion</text><path d="M530 88 L568 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="570" y="268" width="70" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="605.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Grid</text><text x="605.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">database</text><path d="M530 296 L568 296" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M605 268 L605 118" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="340" y="380" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">One ingress, one detector; only the beat-position engine differs (live tracker / offline tracker)</text></svg>