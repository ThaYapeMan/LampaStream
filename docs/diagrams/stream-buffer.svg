<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img"><title>Stream branch: buffer per track identity, learned grid at identity end</title><rect width="680" height="660" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="240" y="30" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340.0" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Stream, canonical frames</text><text x="340.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">48 kHz stereo, in memory</text><path d="M340 86 L340 112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="114" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Track identity present?</text><path d="M240 136 L160 136 L160 196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170" y="166" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">yes</text><path d="M440 136 L540 136 L540 196" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="530" y="166" text-anchor="end" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no (radio, one-file mix)</text><rect x="60" y="198" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="220.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Track known?</text><rect x="440" y="198" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="540.0" y="217.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Sliding window</text><text x="540.0" y="237.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">last 10 min, nothing stored</text><path d="M540 254 L540 280" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="440" y="282" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="540.0" y="301.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Tracker + rolling grid</text><text x="540.0" y="321.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">sections segment the mix</text><path d="M260 220 L300 220 L300 310 L262 310" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="262" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">yes</text><path d="M160 242 L160 268" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="170" y="258" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no</text><rect x="60" y="270" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="289.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Online prior lookup</text><text x="160.0" y="309.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">SongBPM, Beatport; opt-in</text><path d="M160 326 L160 352" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="354" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="160.0" y="373.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Learned grid or buffer</text><text x="160.0" y="393.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">known: grid drives; else buffer</text><path d="M160 410 L160 436" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="438" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="160.0" y="457.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Tracker + rolling grid</text><text x="160.0" y="477.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">seeded by the prior</text><path d="M160 494 L160 520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="522" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="160.0" y="544.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Metadata changes?</text><path d="M60 544 L36 544 L36 466 L58 466" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="44" y="586" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no: keep buffering</text><path d="M260 544 L340 544 L340 480" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="564" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">yes: track ended</text><rect x="290" y="424" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="355.0" y="443.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Full analysis</text><text x="355.0" y="463.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">learned grid → database</text><path d="M355 424 L355 380 L262 380" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/><text x="365" y="404" text-anchor="start" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">new buffer, next track</text><text x="340" y="630" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Audio lives in RAM for one track at most; only grids and metadata persist</text></svg>