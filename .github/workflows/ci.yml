name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LAMPASTREAM_REQUIRE_NATIVE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          xargs sudo apt-get install -y --no-install-recommends < scripts/native-build-packages.txt
          sudo apt-get install -y --no-install-recommends libflac-dev

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Build native library for tests
        run: python scripts/build_native.py

      - name: Build wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert wheels, "No wheel was built"
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  native = archive.getinfo("lampastream/cavacore/_libcavacore.so")
                  assert native.file_size > 0, f"Empty native library in {wheel}"
                  print(f"{wheel}: {native.filename} ({native.file_size} bytes)")
          PY

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (matches installer)
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Build (TypeScript + Vite)
        run: npm run build
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: E2E tests
        run: npm run test:e2e
        working-directory: web

      - name: Check bundle matches source
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- src/lampastream/webui/)" ]]; then
            echo ""
            echo "ERROR: The committed bundle in src/lampastream/webui/ does not match"
            echo "a fresh build of the current web/src/ source."
            echo "Run: cd web && npm run build, then commit src/lampastream/webui/."
            exit 1
          fi
