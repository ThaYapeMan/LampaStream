[project]
name = "lampastream"
version = "0.2.0"
description = "Spectrum-reactive Philips Hue Entertainment lighting driven by LMS or AirPlay 2."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jaap van Vliet" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "hue-entertainment>=0.1.2",
    "numpy>=1.26",
    "soxr>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "matplotlib>=3.8",  # DSP comparison modules imported by the test suite
]
calibration = [
    "soundfile>=0.12",
]

[project.scripts]
lampastream = "lampastream.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/lampastream"]
# Native library and commit metadata are generated and force-included by the build hook.
# webui/ assets are built in the isolated installer source copy before wheel collection.

[tool.hatch.build.targets.wheel.force-include]
"distribution/yeney-core" = "lampastream/notices/yeney-core"
"THIRD_PARTY_NOTICES.md" = "lampastream/notices/THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["third_party"]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
